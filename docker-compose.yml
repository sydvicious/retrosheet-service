services:
  db:
    image: postgres:17
    restart: unless-stopped
    # The loader's daily-stat aggregations are single big sorts over ~16M plays;
    # the 4MB default work_mem spills them to disk. work_mem is per sort, per
    # connection, so this assumes few concurrent heavy queries (fine for a
    # personal server; lower it if many clients hit the API at once).
    command: ["postgres", "-c", "work_mem=256MB", "-c", "maintenance_work_mem=1GB"]
    environment:
      POSTGRES_USER: retrosheet
      POSTGRES_PASSWORD: retrosheet
      POSTGRES_DB: retrosheet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrosheet -d retrosheet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    init: true          # tini as PID 1 so SIGINT/SIGTERM (Ctrl-C, docker stop) actually stop node
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://retrosheet:retrosheet@db:5432/retrosheet
      PG_SCHEMA: retrosheet
      PORT: "5050"
      NODE_ENV: production
    ports:
      - "5050:5050"

  # MCP server (read-only tools over the mart) — streamable HTTP transport,
  # e.g. add http://<host>:5051/mcp as a remote MCP server (over Tailscale).
  mcp:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://retrosheet:retrosheet@db:5432/retrosheet
      PG_SCHEMA: retrosheet
      MCP_TRANSPORT: http
      MCP_PORT: "5051"
      NODE_ENV: production
    ports:
      - "5051:5051"
    command: ["node", "dist/mcp/index.js"]

  # One-shot ETL. Behind the "etl" profile so `docker compose up` never runs it.
  # Populate with:  docker compose run --rm loader
  loader:
    build: .
    init: true          # so Ctrl-C on `docker compose run --rm loader` stops the load
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://retrosheet:retrosheet@db:5432/retrosheet
      PG_SCHEMA: retrosheet
      RETROSHEET_DIR: /data
    volumes:
      # Host Retrosheet data (defaults to ./.data from scripts/fetch-data.sh),
      # mounted read-only.
      - "${RETROSHEET_DIR:-./.data}:/data:ro"
    command: ["node", "dist/etl/run.js"]

volumes:
  pgdata:
